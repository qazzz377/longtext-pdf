<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>pdf</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#fff;color:#222;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
h1{font-size:22px;margin:8px 0 20px}
textarea{
 width:100%;height:55vh;padding:14px;
 border:1px solid #ccc;border-radius:10px;
 font-size:16px;line-height:1.6;resize:vertical;
}
button{
 width:100%;margin-top:14px;padding:16px;
 border:0;border-radius:10px;
 background:#111;color:white;
 font-size:17px;font-weight:bold;
}
button:disabled{opacity:.5}
#status{margin-top:16px;font-size:14px;white-space:pre-wrap}
#result{
 display:none;margin-top:18px;padding:14px;
 border:1px solid #ddd;border-radius:10px;
 overflow-wrap:anywhere;
}
#result a{display:block;margin-top:12px;font-weight:bold}
</style>
</head>
<body>

<h1>pdf</h1>

<textarea id="input" placeholder="ここに文章を貼り付け"></textarea>

<button id="create" onclick="createPDF()">PDFを作成する</button>

<div id="status"></div>
<div id="result"></div>

<script>
const API="https://aisenseapi.com/services/v1/html2pdf";

function esc(s){
 return s.replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function makeHTML(text){
 const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");

 const body=lines.map(line=>{
  return `<p>${line===""?"&nbsp;":esc(line)}</p>`;
 }).join("\n");

 return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@page{
 size:A4;
 margin:15mm 16mm;
}
html,body{
 margin:0;
 padding:0;
 width:auto;
 height:auto;
 overflow:visible;
}
body{
 font-family:sans-serif;
 font-size:10pt;
 line-height:1.65;
 color:#222;
}
p{
 display:block;
 margin:0;
 padding:0;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 word-break:break-all;
 page-break-inside:auto;
 break-inside:auto;
}
</style>
</head>
<body>
${body}
</body>
</html>`;
}

async function createPDF(){
 const input=document.getElementById("input");
 const button=document.getElementById("create");
 const status=document.getElementById("status");
 const result=document.getElementById("result");

 if(!input.value.trim()){
  status.textContent="文章を入力してください。";
  return;
 }

 button.disabled=true;
 result.style.display="none";
 status.textContent="PDFを生成しています…";

 try{
  const html=makeHTML(input.value);

  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    html:html,
    options:{
     "page-size":"A4",
     "orientation":"Portrait",
     "margin-top":"15mm",
     "margin-bottom":"15mm",
     "margin-left":"16mm",
     "margin-right":"16mm"
    }
   })
  });

  const data=await response.json();

  if(!response.ok || !data.storage_url){
   throw new Error(data.error || data.message || "PDF生成に失敗しました");
  }

  const base=location.origin+
   location.pathname.replace(/index\.html$/,"").replace(/\/?$/,"/");

  const viewer=base+"viewer.html?url="+
   encodeURIComponent(data.storage_url);

  result.style.display="block";
  result.innerHTML=
   "PDFを作成しました。<br>"+
   "<a href='"+viewer+"' target='_blank'>PDFを開く</a>"+
   "<a href='"+data.storage_url+"' target='_blank'>PDFファイルを直接開く</a>";

  status.textContent=
   "生成完了。\nPDFを開いて、最後まで文章が入っているか確認してください。";

 }catch(error){
  status.textContent="エラー："+error.message;
 }finally{
  button.disabled=false;
 }
}
</script>
</body>
</html>
