<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pdf">
<title>pdf</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:white;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif
}
h1{font-size:22px;margin:5px 0 18px}
textarea{
  display:block;width:100%;height:55vh;padding:14px;
  border:1px solid #ccc;border-radius:8px;
  font-size:16px;line-height:1.8;resize:vertical
}
button{
  width:100%;padding:16px;margin-top:14px;border:0;
  border-radius:8px;background:#111;color:white;
  font-size:16px;font-weight:bold
}
button:disabled{opacity:.5}
#status{
  margin-top:18px;font-size:14px;line-height:1.7;
  overflow-wrap:anywhere
}
#url{
  display:none;width:100%;padding:12px;margin-top:12px;
  border:1px solid #ccc;border-radius:8px;font-size:14px
}
#copy{display:none;background:#444}
</style>
</head>

<body>

<h1>PDF</h1>

<textarea id="input" placeholder="ここに文章を貼り付けてください。"></textarea>

<button id="create">全文をPDFにしてURLを作る</button>

<div id="status"></div>
<input id="url" readonly>
<button id="copy">URLをコピー</button>

<script>
const input=document.getElementById("input");
const createButton=document.getElementById("create");
const statusBox=document.getElementById("status");
const urlField=document.getElementById("url");
const copyButton=document.getElementById("copy");

const PAGE_WIDTH=794;
const PAGE_HEIGHT=1123;
const PAGE_PADDING=70;
const LINE_HEIGHT=28;
const FONT_SIZE=16;
const MAX_LINES=32;

function wrapText(text){
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");
  ctx.font=FONT_SIZE+"px sans-serif";

  const maxWidth=PAGE_WIDTH-PAGE_PADDING*2;
  const result=[];

  const source=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const originalLines=source.split("\n");

  for(const originalLine of originalLines){
    if(originalLine===""){
      result.push("");
      continue;
    }

    let current="";
    for(const char of Array.from(originalLine)){
      const test=current+char;

      if(current && ctx.measureText(test).width>maxWidth){
        result.push(current);
        current=char;
      }else{
        current=test;
      }
    }

    result.push(current);
  }

  return result;
}

function makePage(lines){
  const page=document.createElement("div");

  page.style.cssText=`
    position:fixed;
    left:-10000px;
    top:0;
    width:${PAGE_WIDTH}px;
    height:${PAGE_HEIGHT}px;
    padding:${PAGE_PADDING}px;
    box-sizing:border-box;
    background:#fff;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:${FONT_SIZE}px;
    line-height:${LINE_HEIGHT}px;
    overflow:hidden;
  `;

  for(const text of lines){
    const line=document.createElement("div");

    line.style.cssText=`
      height:${LINE_HEIGHT}px;
      line-height:${LINE_HEIGHT}px;
      white-space:pre;
      overflow:hidden;
    `;

    line.textContent=text;
    page.appendChild(line);
  }

  document.body.appendChild(page);
  return page;
}

createButton.addEventListener("click",async()=>{

  const originalText=input.value;

  if(!originalText.trim()){
    statusBox.textContent="文章を入力してください。";
    return;
  }

  if(!window.html2canvas || !window.jspdf){
    statusBox.textContent="PDF生成ライブラリを読み込めません。通信を確認してください。";
    return;
  }

  createButton.disabled=true;
  urlField.style.display="none";
  copyButton.style.display="none";
  copyButton.textContent="URLをコピー";

  try{

    statusBox.textContent="文章をページに分割しています……";

    await document.fonts.ready;

    const lines=wrapText(originalText);
    const pages=[];

    for(let i=0;i<lines.length;i+=MAX_LINES){
      pages.push(lines.slice(i,i+MAX_LINES));
    }

    const {jsPDF}=window.jspdf;

    const pdf=new jsPDF({
      orientation:"portrait",
      unit:"mm",
      format:"a4",
      compress:true
    });

    for(let i=0;i<pages.length;i++){

      statusBox.textContent=
        "PDFを作成しています…… "+
        (i+1)+" / "+pages.length+" ページ";

      const page=makePage(pages[i]);

      try{

        const canvas=await html2canvas(page,{
          scale:2,
          backgroundColor:"#ffffff",
          width:PAGE_WIDTH,
          height:PAGE_HEIGHT,
          windowWidth:PAGE_WIDTH,
          windowHeight:PAGE_HEIGHT,
          logging:false
        });

        const image=canvas.toDataURL("image/jpeg",0.90);

        if(i>0){
          pdf.addPage("a4","portrait");
        }

        pdf.addImage(
          image,
          "JPEG",
          0,
          0,
          210,
          297,
          undefined,
          "FAST"
        );

        canvas.width=1;
        canvas.height=1;

      }finally{
        page.remove();
      }

    }

    statusBox.textContent="PDFを保存サービスにアップロードしています……";

    const pdfBlob=pdf.output("blob");

    if(pdfBlob.size>50*1024*1024){
      throw new Error("PDFが大きすぎます。文章量を減らしてください。");
    }

    const form=new FormData();
    form.append("file",pdfBlob,"document.pdf");

    const response=await fetch(
      "https://aisenseapi.com/services/v1/storage",
      {
        method:"POST",
        body:form
      }
    );

    const responseText=await response.text();

    let result;

    try{
      result=JSON.parse(responseText);
    }catch{
      throw new Error("保存サービスの応答を読み取れません。HTTP "+response.status);
    }

    if(!response.ok){
      throw new Error(
        result.error||result.message||"アップロード失敗 HTTP "+response.status
      );
    }

    if(!result.storage_url){
      throw new Error("保存URLが返されませんでした。");
    }

    const viewerURL=
      location.origin+
      location.pathname.replace(/index\.html$/,"")+
      "viewer.html?url="+
      encodeURIComponent(result.storage_url);

    urlField.value=viewerURL;
    urlField.style.display="block";
    copyButton.style.display="block";

    statusBox.textContent=
      "PDF完成！ "+
      pages.length+"ページ／"+
      originalText.length+"文字／"+
      Math.round(pdfBlob.size/1024)+"KB";

  }catch(error){

    statusBox.textContent="エラー："+error.message;

  }finally{

    createButton.disabled=false;

  }

});

copyButton.addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(urlField.value);
    copyButton.textContent="コピーしました";
  }catch{
    urlField.select();
    document.execCommand("copy");
    copyButton.textContent="コピーしました";
  }
});
</script>

</body>
</html>
