<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>pdf</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,sans-serif}
main{max-width:700px;margin:auto;padding:22px 16px 40px}
h1{font-size:24px}
textarea{width:100%;height:55vh;padding:16px;border:1px solid #ccc;border-radius:12px;font-size:16px;line-height:1.8}
button{width:100%;padding:17px;margin-top:16px;border:0;border-radius:12px;background:#111;color:white;font-size:17px}
#status,#result{margin-top:18px;line-height:1.7;overflow-wrap:anywhere}
#result{display:none;padding:16px;background:white;border-radius:12px}
#result a{display:block;margin-top:12px;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>pdf</h1>
<textarea id="input" placeholder="ここに文章を貼り付け"></textarea>
<button id="make">PDFを作成する</button>
<div id="status"></div>
<div id="result"></div>
</main>

<script>
const input=document.getElementById("input");
const button=document.getElementById("make");
const status=document.getElementById("status");
const result=document.getElementById("result");

function esc(s){
 return s.replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function splitPages(text){
 const lines=text.replace(/\r\n?/g,"\n").split("\n");
 const visual=[];
 for(const line of lines){
  const chars=Array.from(line);
  if(!chars.length){visual.push("");continue;}
  for(let i=0;i<chars.length;i+=30){
   visual.push(chars.slice(i,i+30).join(""));
  }
 }
 const pages=[];
 for(let i=0;i<visual.length;i+=25){
  pages.push(visual.slice(i,i+25));
 }
 return pages;
}

button.onclick=async()=>{
 const text=input.value;
 if(!text.trim()){
  status.textContent="文章を入力してください";
  return;
 }

 const pages=splitPages(text);
 const sections=pages.map((lines,i)=>`
 <section style="${i===0?"":"page-break-before:always;"}">
 ${lines.map(line=>`<div>${line?esc(line):"&nbsp;"}</div>`).join("")}
 </section>
 `).join("");

 const html=`<!DOCTYPE html>
 <html lang="ja">
 <head><meta charset="UTF-8">
 <style>
 @page{size:A4;margin:15mm 16mm}
 html,body{margin:0;padding:0}
 body{font-family:sans-serif;font-size:10pt;line-height:1.65;color:#222}
 section{display:block;width:100%;height:auto;overflow:visible}
 section div{min-height:1.65em;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all}
 </style></head>
 <body>${sections}</body></html>`;

 const payload={
  html:html,
  options:{
   "page-size":"A4",
   "orientation":"Portrait",
   "margin-top":"15mm",
   "margin-bottom":"15mm",
   "margin-left":"16mm",
   "margin-right":"16mm"
  }
 };

 const body=JSON.stringify(payload);
 if(new TextEncoder().encode(body).length>230000){
  status.textContent="送信上限を超えています。文章を短くしてください。";
  return;
 }

 button.disabled=true;
 button.textContent="作成中……";
 status.textContent="PDFを生成しています……";
 result.style.display="none";

 try{
  const r=await fetch("https://aisenseapi.com/services/v1/html2pdf",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body
  });
  const d=await r.json();

  if(!r.ok||!d.storage_url)throw Error(d.message||d.error||"生成失敗");

  const viewer=location.origin+
   location.pathname.replace(/index\.html$/,"").replace(/\/?$/,"/")+
   "viewer.html?url="+encodeURIComponent(d.storage_url);

  result.innerHTML="";
  const label=document.createElement("strong");
  label.textContent="PDF生成完了";

  const link=document.createElement("a");
  link.href=viewer;
  link.textContent="PDFを開く・共有する";
  link.target="_blank";

  const copy=document.createElement("button");
  copy.textContent="共有URLをコピー";
  copy.onclick=async()=>{
   try{
    await navigator.clipboard.writeText(viewer);
    copy.textContent="コピーしました";
   }catch(e){
    const t=document.createElement("textarea");
    t.value=viewer;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    t.remove();
    copy.textContent="コピーしました";
   }
  };

  result.append(label,link,copy);
  result.style.display="block";
  status.textContent="分割指定："+pages.length+"ページ。PDFを開いて確認してください。";

 }catch(e){
  status.textContent="エラー："+e.message;
 }finally{
  button.disabled=false;
  button.textContent="PDFを作成する";
 }
};
</script>
</main>
</body>
</html>
