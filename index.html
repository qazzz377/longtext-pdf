<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>pdf</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#111}
h1{font-size:25px;margin:12px 0 22px}
textarea{width:100%;height:55vh;padding:15px;border:1px solid #ccc;border-radius:12px;font-size:16px;line-height:1.7;resize:vertical}
button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.45}
#status{margin:16px 0;font-size:14px;line-height:1.6}
#url{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:13px}
.small{font-size:12px;color:#777;margin-top:12px}
</style>
</head>
<body>
<h1>pdf</h1>

<textarea id="input" placeholder="ここに長文を貼り付け"></textarea>

<button id="create" onclick="createPDF()">PDFを作成してURL発行</button>

<div id="status">文章を貼り付けてボタンを押してください。</div>

<input id="url" type="text" readonly placeholder="発行されたURLがここに表示されます">

<button id="copy" onclick="copyURL()" disabled>URLをコピー</button>

<div class="small">PDFは一時保存されます。共有URLの取り扱いに注意してください。</div>

<script>
const input=document.getElementById("input");
const statusBox=document.getElementById("status");
const urlField=document.getElementById("url");
const createButton=document.getElementById("create");
const copyButton=document.getElementById("copy");

function setStatus(text){
  statusBox.textContent=text;
}

function makePages(text){
  const canvas=document.createElement("canvas");
  canvas.width=1240;
  canvas.height=1754;
  const ctx=canvas.getContext("2d");
  ctx.font='30px -apple-system, BlinkMacSystemFont, sans-serif';

  const paragraphs=text.replace(/\r/g,"").split("\n");
  const lines=[];

  for(const paragraph of paragraphs){
    if(paragraph===""){
      lines.push("");
      continue;
    }
    let line="";
    for(const char of paragraph){
      const next=line+char;
      if(ctx.measureText(next).width>1080 && line){
        lines.push(line);
        line=char;
      }else{
        line=next;
      }
    }
    lines.push(line);
  }

  const pages=[];
  const linesPerPage=39;
  for(let i=0;i<lines.length;i+=linesPerPage){
    pages.push(lines.slice(i,i+linesPerPage));
  }
  return pages.length?pages:[[""]];
}

function canvasToJpeg(canvas){
  const data=canvas.toDataURL("image/jpeg",0.88);
  const binary=atob(data.split(",")[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return bytes;
}

function makeImagePages(pageLines){
  const images=[];
  for(const lines of pageLines){
    const canvas=document.createElement("canvas");
    canvas.width=1240;
    canvas.height=1754;
    const ctx=canvas.getContext("2d");

    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,1240,1754);
    ctx.fillStyle="#111111";
    ctx.font='30px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textBaseline="top";

    let y=100;
    for(const line of lines){
      ctx.fillText(line,80,y);
      y+=40;
    }
    images.push(canvasToJpeg(canvas));
  }
  return images;
}

function joinBytes(parts){
  let length=0;
  for(const p of parts)length+=p.length;
  const result=new Uint8Array(length);
  let offset=0;
  for(const p of parts){
    result.set(p,offset);
    offset+=p.length;
  }
  return result;
}

function ascii(text){
  return new TextEncoder().encode(text);
}

function buildPDF(images){
  const objects=[];
  const pageRefs=[];
  const pageCount=images.length;

  objects[1]=ascii("<< /Type /Catalog /Pages 2 0 R >>");

  for(let i=0;i<pageCount;i++){
    const pageObj=3+i*3;
    const contentObj=pageObj+1;
    const imageObj=pageObj+2;
    pageRefs.push(pageObj+" 0 R");

    const pageContent=
      "q\n595 0 0 842 0 0 cm\n/Im0 Do\nQ\n";
    const contentBytes=ascii(pageContent);

    objects[pageObj]=ascii(
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] "+
      "/Resources << /XObject << /Im0 "+imageObj+" 0 R >> >> "+
      "/Contents "+contentObj+" 0 R >>"
    );

    objects[contentObj]=joinBytes([
      ascii("<< /Length "+contentBytes.length+" >>\nstream\n"),
      contentBytes,
      ascii("endstream")
    ]);

    const jpg=images[i];
    objects[imageObj]=joinBytes([
      ascii(
        "<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 "+
        "/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode "+
        "/Length "+jpg.length+" >>\nstream\n"
      ),
      jpg,
      ascii("\nendstream")
    ]);
  }

  objects[2]=ascii(
    "<< /Type /Pages /Kids ["+pageRefs.join(" ")+"] /Count "+pageCount+" >>"
  );

  const parts=[ascii("%PDF-1.4\n")];
  const offsets=[0];
  let position=parts[0].length;

  for(let i=1;i<objects.length;i++){
    offsets[i]=position;
    const part=joinBytes([
      ascii(i+" 0 obj\n"),
      objects[i],
      ascii("\nendobj\n")
    ]);
    parts.push(part);
    position+=part.length;
  }

  const xrefPosition=position;
  let xref="xref\n0 "+objects.length+"\n";
  xref+="0000000000 65535 f \n";
  for(let i=1;i<objects.length;i++){
    xref+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  }

  const trailer=
    "trailer\n<< /Size "+objects.length+" /Root 1 0 R >>\n"+
    "startxref\n"+xrefPosition+"\n%%EOF";

  parts.push(ascii(xref+trailer));
  return new Blob([joinBytes(parts)],{type:"application/pdf"});
}

async function createPDF(){
  const text=input.value.trim();
  if(!text){
    setStatus("先に文章を貼り付けてください。");
    return;
  }

  createButton.disabled=true;
  copyButton.disabled=true;
  urlField.value="";

  try{
    setStatus("PDFを作成しています……");

    const pages=makePages(text);
    const images=makeImagePages(pages);
    const blob=buildPDF(images);

    setStatus("PDFをアップロードしています……");

    const form=new FormData();
    form.append("file",blob,"document.pdf");

    const response=await fetch(
      "https://aisenseapi.com/services/v1/storage",
      {method:"POST",body:form}
    );

    const result=await response.json();

    if(!response.ok || !result.storage_url){
      throw new Error(result.error || "アップロードに失敗しました");
    }

    const viewerURL=
      location.origin+
      location.pathname.replace(/index\.html$/,"")+
      "viewer.html?url="+encodeURIComponent(result.storage_url);

    urlField.value=viewerURL;
    copyButton.disabled=false;

    setStatus("完成しました。閲覧用URLをコピーできます。");

  }catch(error){
    setStatus("エラー："+error.message);
  }finally{
    createButton.disabled=false;
  }
}

async function copyURL(){
  if(!urlField.value)return;
  try{
    await navigator.clipboard.writeText(urlField.value);
    setStatus("URLをコピーしました。");
  }catch(error){
    urlField.select();
    document.execCommand("copy");
    setStatus("URLをコピーしました。");
  }
}
</script>
</body>
</html>
