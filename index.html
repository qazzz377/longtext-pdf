<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>pdf</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px;font-family:-apple-system,sans-serif;background:#fff;color:#111}
h1{font-size:25px;margin:12px 0 22px}
textarea{width:100%;height:55vh;padding:15px;border:1px solid #ccc;border-radius:12px;font-size:16px;line-height:1.7}
button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.45}
#status{margin:16px 0;font-size:14px;line-height:1.6}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<h1>pdf</h1>
<textarea id="input" placeholder="ここに長文を貼り付け"></textarea>
<button id="create" onclick="createPDF()">PDFを作成してURL発行</button>
<div id="status">文章を貼り付けてボタンを押してください。</div>
<input id="url" readonly placeholder="発行されたURLがここに表示されます">
<button id="copy" onclick="copyURL()" disabled>URLをコピー</button>

<script>
const input=document.getElementById("input");
const statusBox=document.getElementById("status");
const urlField=document.getElementById("url");
const createButton=document.getElementById("create");
const copyButton=document.getElementById("copy");

function escapeHTML(text){
  return text.replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

async function createPDF(){
  const text=input.value.trim();
  if(!text){
    statusBox.textContent="先に文章を貼り付けてください。";
    return;
  }

  createButton.disabled=true;
  copyButton.disabled=true;
  urlField.value="";

  try{
    statusBox.textContent="PDFを作成しています……";

    const html=`<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@page{size:A4;margin:22mm 20mm}
body{font-family:"Noto Sans CJK JP",sans-serif;font-size:11pt;line-height:1.9;color:#111;overflow-wrap:break-word}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body><div class="text">${escapeHTML(text)}</div></body>
</html>`;

    const response=await fetch(
      "https://aisenseapi.com/services/v1/html2pdf",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          data:html,
          options:{
            "page-size":"A4",
            orientation:"Portrait",
            "margin-top":"20mm",
            "margin-bottom":"20mm",
            "margin-left":"20mm",
            "margin-right":"20mm"
          }
        })
      }
    );

    const result=await response.json();

    if(!response.ok || !result.storage_url){
      throw new Error(result.error || "PDF作成に失敗しました");
    }

    const viewerURL=
      location.origin+
      location.pathname.replace(/index\.html$/,"")+
      "viewer.html?url="+encodeURIComponent(result.storage_url);

    urlField.value=viewerURL;
    copyButton.disabled=false;
    statusBox.textContent="完成しました。閲覧用URLをコピーできます。";

  }catch(error){
    statusBox.textContent="エラー："+error.message;
  }finally{
    createButton.disabled=false;
  }
}

async function copyURL(){
  if(!urlField.value)return;
  try{
    await navigator.clipboard.writeText(urlField.value);
    statusBox.textContent="URLをコピーしました。";
  }catch(error){
    urlField.select();
    document.execCommand("copy");
    statusBox.textContent="URLをコピーしました。";
  }
}
</script>
</body>
</html>
