<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pdf">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=8">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=8">
<title>pdf</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:24px 18px;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
h1{font-size:25px;margin:8px 0}
p{font-size:14px;color:#777;line-height:1.7}
textarea{
  display:block;
  width:100%;
  height:58vh;
  padding:15px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  line-height:1.8;
  resize:vertical;
}
button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:17px;
  border:0;
  border-radius:11px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
}
button:disabled{opacity:.4}
#share{display:none;background:#2878df}
#status{font-size:13px;margin-top:15px;color:#555}
</style>
</head>

<body>

<h1>pdf</h1>
<p>文章を貼り付けてPDFにできます。日本語・長文・複数ページに対応しています。</p>

<textarea id="input" placeholder="ここに長い文章を貼り付けてください"></textarea>

<button id="create" onclick="createPDF()">PDFを作成</button>
<button id="share" onclick="sharePDF()">PDFを共有する</button>

<div id="status">準備完了。文章を貼り付けてください。</div>

<script>
let pdfFile=null;

function makeCanvas(){
  const canvas=document.createElement("canvas");
  canvas.width=1240;
  canvas.height=1754;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,1240,1754);

  ctx.fillStyle="#111111";
  ctx.font="30px -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif";
  ctx.textBaseline="top";

  return {canvas,ctx,y:100};
}

function canvasToJpeg(canvas){
  const data=canvas.toDataURL("image/jpeg",0.88);
  const binary=atob(data.split(",")[1]);
  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }

  return bytes;
}

function buildPDF(images){

  const encoder=new TextEncoder();
  const parts=[];
  const offsets=[0];
  let position=0;

  function addText(text){
    const bytes=encoder.encode(text);
    parts.push(bytes);
    position+=bytes.length;
  }

  function addBytes(bytes){
    parts.push(bytes);
    position+=bytes.length;
  }

  const pageCount=images.length;
  const objectCount=2+pageCount*3;

  addText("%PDF-1.4\n");

  function addObject(id,body){
    offsets[id]=position;
    addText(id+" 0 obj\n");
    addText(body);
    addText("\nendobj\n");
  }

  addObject(1,"<< /Type /Catalog /Pages 2 0 R >>");

  let kids="";

  for(let i=0;i<pageCount;i++){
    const pageId=3+i*3;
    kids+=pageId+" 0 R ";
  }

  addObject(
    2,
    "<< /Type /Pages /Kids ["+kids+"] /Count "+pageCount+" >>"
  );

  for(let i=0;i<pageCount;i++){

    const pageId=3+i*3;
    const imageId=pageId+1;
    const contentId=pageId+2;

    addObject(
      pageId,
      "<< /Type /Page /Parent 2 0 R "+
      "/MediaBox [0 0 595.28 841.89] "+
      "/Resources << /ProcSet [/PDF /ImageC] "+
      "/XObject << /Im0 "+imageId+" 0 R >> >> "+
      "/Contents "+contentId+" 0 R >>"
    );

    const jpeg=images[i];

    offsets[imageId]=position;

    addText(imageId+" 0 obj\n");
    addText(
      "<< /Type /XObject /Subtype /Image "+
      "/Width 1240 /Height 1754 "+
      "/ColorSpace /DeviceRGB /BitsPerComponent 8 "+
      "/Filter /DCTDecode /Length "+jpeg.length+" >>\n"
    );

    addText("stream\n");
    addBytes(jpeg);
    addText("\nendstream\nendobj\n");

    const content=
      "q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n";

    const contentBytes=encoder.encode(content);

    offsets[contentId]=position;

    addText(contentId+" 0 obj\n");
    addText("<< /Length "+contentBytes.length+" >>\n");
    addText("stream\n");
    addBytes(contentBytes);
    addText("endstream\nendobj\n");
  }

  const xrefPosition=position;

  addText("xref\n0 "+(objectCount+1)+"\n");
  addText("0000000000 65535 f \n");

  for(let i=1;i<=objectCount;i++){
    addText(
      String(offsets[i]).padStart(10,"0")+
      " 00000 n \n"
    );
  }

  addText(
    "trailer\n<< /Size "+(objectCount+1)+
    " /Root 1 0 R >>\n"
  );

  addText("startxref\n"+xrefPosition+"\n%%EOF");

  return new Blob(parts,{type:"application/pdf"});
}

async function createPDF(){

  const text=document.getElementById("input").value;
  const status=document.getElementById("status");
  const button=document.getElementById("create");
  const shareButton=document.getElementById("share");

  if(!text.trim()){
    alert("文章を入力してください。");
    return;
  }

  button.disabled=true;
  shareButton.style.display="none";
  pdfFile=null;

  try{

    status.textContent="PDFを作成しています……";

    const images=[];
    let page=makeCanvas();

    const margin=100;
    const maxWidth=1040;
    const lineHeight=48;
    const bottom=1650;

    function savePage(){
      images.push(canvasToJpeg(page.canvas));
    }

    function addLine(line){

      if(page.y+lineHeight>bottom){
        savePage();
        page=makeCanvas();
      }

      if(line!==""){
        page.ctx.fillText(line,margin,page.y);
      }

      page.y+=lineHeight;
    }

    const paragraphs=text
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n")
      .split("\n");

    for(const paragraph of paragraphs){

      if(paragraph===""){
        addLine("");
        continue;
      }

      let line="";

      for(const char of Array.from(paragraph)){

        const test=line+char;

        if(
          page.ctx.measureText(test).width>maxWidth &&
          line!==""
        ){
          addLine(line);
          line=char;
        }else{
          line=test;
        }
      }

      if(line!==""){
        addLine(line);
      }
    }

    savePage();

    status.textContent="PDFファイルを組み立てています……";

    const blob=buildPDF(images);

    pdfFile=new File(
      [blob],
      "document.pdf",
      {type:"application/pdf"}
    );

    shareButton.style.display="block";

    status.textContent=
      "PDFが完成しました。全"+images.length+"ページです。";

  }catch(error){

    console.error(error);

    status.textContent=
      "作成エラー："+(error.message||"原因不明");

  }finally{

    button.disabled=false;

  }
}

async function sharePDF(){

  if(!pdfFile){
    alert("先にPDFを作成してください。");
    return;
  }

  try{

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[pdfFile]})
    ){

      await navigator.share({
        files:[pdfFile],
        title:"PDF"
      });

    }else{

      const url=URL.createObjectURL(pdfFile);
      const a=document.createElement("a");

      a.href=url;
      a.download="document.pdf";

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },60000);

      document.getElementById("status").textContent=
        "PDFを保存しました。ファイルアプリから共有してください。";
    }

  }catch(error){

    if(error.name!=="AbortError"){
      document.getElementById("status").textContent=
        "共有エラー："+(error.message||"もう一度お試しください。");
    }
  }
}
</script>

</body>
</html>
