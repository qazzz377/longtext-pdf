<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pdf">
<title>pdf</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #fff;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

h1 {
  font-size: 22px;
  margin: 5px 0 18px;
}

textarea {
  display: block;
  width: 100%;
  height: 55vh;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  line-height: 1.8;
  resize: vertical;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 14px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 18px;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#url {
  display: none;
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
}

#copy {
  display: none;
  background: #444;
}
</style>
</head>

<body>

<h1>PDF</h1>

<textarea
  id="input"
  placeholder="ここに文章を貼り付けてください。"
></textarea>

<button id="create">全文をPDFにしてURLを作る</button>

<div id="status"></div>

<input id="url" readonly>

<button id="copy">URLをコピー</button>

<script>
const input = document.getElementById("input");
const createButton = document.getElementById("create");
const statusBox = document.getElementById("status");
const urlField = document.getElementById("url");
const copyButton = document.getElementById("copy");

function escapeHTML(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

createButton.addEventListener("click", async () => {
  const text = input.value;

  if (!text.trim()) {
    statusBox.textContent = "文章を入力してください。";
    return;
  }

  createButton.disabled = true;
  urlField.style.display = "none";
  copyButton.style.display = "none";
  copyButton.textContent = "URLをコピー";

  try {
    statusBox.textContent = "PDFを作成しています……";

    const html = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@page {
  size: A4;
  margin: 22mm 18mm;
}

body {
  font-family: sans-serif;
  font-size: 11pt;
  line-height: 1.9;
  color: #111;
  overflow-wrap: break-word;
}

.text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="text">${escapeHTML(text)}</div>
</body>
</html>`;

    const response = await fetch(
      "https://aisenseapi.com/services/v1/html2pdf",
      {
        method: "POST",
        headers: {
          "Content-Type": "text/html; charset=UTF-8"
        },
        body: html
      }
    );

    const responseText = await response.text();

    let result;

    try {
      result = JSON.parse(responseText);
    } catch {
      throw new Error(
        "APIから正しい返答がありません。HTTP " +
        response.status
      );
    }

    if (!response.ok) {
      throw new Error(
        result.error || "PDF生成に失敗しました。HTTP " +
        response.status
      );
    }

    if (!result.storage_url) {
      throw new Error(
        result.error || "PDFの保存URLが返されませんでした。"
      );
    }

    statusBox.textContent = "共有URLを作っています……";

    const viewerURL =
      location.origin +
      location.pathname.replace(/index\.html$/, "") +
      "viewer.html?url=" +
      encodeURIComponent(result.storage_url);

    urlField.value = viewerURL;
    urlField.style.display = "block";
    copyButton.style.display = "block";

    statusBox.textContent =
      "PDFが完成しました。URLをコピーできます。";

  } catch (error) {
    statusBox.textContent = "エラー：" + error.message;
  } finally {
    createButton.disabled = false;
  }
});

copyButton.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(urlField.value);
    copyButton.textContent = "コピーしました";
  } catch {
    urlField.select();
    document.execCommand("copy");
    copyButton.textContent = "コピーしました";
  }
});
</script>

</body>
</html>
