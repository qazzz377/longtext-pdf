<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pdf">
<title>pdf</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:white;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif
}
h1{font-size:22px;margin:5px 0 18px}
textarea{
  display:block;width:100%;height:55vh;padding:14px;
  border:1px solid #ccc;border-radius:8px;
  font-size:16px;line-height:1.8;resize:vertical
}
button{
  width:100%;padding:16px;margin-top:14px;border:0;
  border-radius:8px;background:#111;color:white;
  font-size:16px;font-weight:bold
}
button:disabled{opacity:.5}
#status{
  margin-top:18px;font-size:14px;line-height:1.7;
  overflow-wrap:anywhere
}
#url{
  display:none;width:100%;padding:12px;margin-top:12px;
  border:1px solid #ccc;border-radius:8px;font-size:14px
}
#copy{display:none;background:#444}
</style>
</head>
<body>
<h1>PDF</h1>
<textarea id="input" placeholder="ここに文章を貼り付けてください。"></textarea>
<button id="create">全文をPDFにしてURLを作る</button>
<div id="status"></div>
<input id="url" readonly>
<button id="copy">URLをコピー</button>
<script>
const input=document.getElementById("input");
const createButton=document.getElementById("create");
const statusBox=document.getElementById("status");
const urlField=document.getElementById("url");
const copyButton=document.getElementById("copy");
function escapeHTML(text){
return text.replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[c]);
}
createButton.addEventListener("click",async()=>{
const originalText=input.value;
if(!originalText.trim()){
statusBox.textContent="文章を入力してください。";
return;
}
createButton.disabled=true;
urlField.style.display="none";
copyButton.style.display="none";
copyButton.textContent="URLをコピー";
try{
statusBox.textContent="PDFを作成しています……";
const escaped=escapeHTML(originalText);
const paragraphs=escaped.split(/\r\n|\r|\n/).map(line=>
line?`<p>${line}</p>`:`<p>&nbsp;</p>`
).join("");
const html=`<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@page{size:A4;margin:18mm 17mm}
html,body{margin:0;padding:0}
body{
font-family:sans-serif;
font-size:11pt;
line-height:1.85;
color:#111;
}
p{
margin:0;
padding:0;
white-space:pre-wrap;
overflow-wrap:anywhere;
word-break:normal;
}
</style>
</head>
<body>${paragraphs}</body>
</html>`;
const payload=JSON.stringify({
data:html,
options:{
"page-size":"A4",
"orientation":"Portrait",
"margin-top":"18mm",
"margin-bottom":"18mm",
"margin-left":"17mm",
"margin-right":"17mm"
}
});
const bytes=new TextEncoder().encode(payload).length;
if(bytes>250000){
throw new Error("送信上限を超えています。文章量を減らしてください。");
}
const response=await fetch(
"https://aisenseapi.com/services/v1/html2pdf",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:payload
}
);
const responseText=await response.text();
let result;
try{result=JSON.parse(responseText)}
catch{throw new Error("API応答エラー HTTP "+response.status)}
if(!response.ok){
throw new Error(result.error||result.message||"PDF生成失敗 HTTP "+response.status);
}
if(!result.storage_url){
throw new Error(result.error||result.message||"保存URLがありません。");
}
const viewerURL=location.origin+
location.pathname.replace(/index\.html$/,"")+
"viewer.html?url="+encodeURIComponent(result.storage_url);
urlField.value=viewerURL;
urlField.style.display="block";
copyButton.style.display="block";
statusBox.textContent="PDFを作成しました。入力文字数："+originalText.length+"文字／送信データ："+bytes+"バイト";
}catch(error){
statusBox.textContent="エラー："+error.message;
}finally{
createButton.disabled=false;
}
});
copyButton.addEventListener("click",async()=>{
try{
await navigator.clipboard.writeText(urlField.value);
copyButton.textContent="コピーしました";
}catch{
urlField.select();
document.execCommand("copy");
copyButton.textContent="コピーしました";
}
});
</script>
</body>
</html>
