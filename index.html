<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pdf">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=7">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=7">
<title>pdf</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:24px 18px;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
h1{font-size:25px;margin:8px 0}
p{font-size:14px;color:#777;line-height:1.7}
textarea{
  display:block;
  width:100%;
  height:58vh;
  padding:15px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  line-height:1.8;
  resize:vertical;
}
button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:17px;
  border:0;
  border-radius:11px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
}
button:disabled{opacity:.4}
#share{display:none;background:#2878df}
#status{font-size:13px;margin-top:15px;color:#555}
</style>
</head>

<body>

<h1>pdf</h1>
<p>文章を貼り付けてPDFにできます。日本語・長文・複数ページに対応しています。</p>

<textarea id="input" placeholder="ここに長い文章を貼り付けてください"></textarea>

<button id="create" onclick="createPDF()">PDFを作成</button>
<button id="share" onclick="sharePDF()">PDFを共有する</button>

<div id="status">PDF機能を読み込んでいます……</div>

<script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"
onload="document.getElementById('status').textContent='準備完了。文章を貼り付けてください。'"
onerror="document.getElementById('status').textContent='PDF機能を読み込めません。通信を確認してください。'">
</script>

<script>
let pdfFile=null;

async function createPDF(){

  const text=document.getElementById("input").value;
  const status=document.getElementById("status");
  const button=document.getElementById("create");
  const shareButton=document.getElementById("share");

  if(!text.trim()){
    alert("文章を入力してください。");
    return;
  }

  if(!window.jspdf){
    alert("PDF機能を読み込めません。通信を確認してください。");
    return;
  }

  button.disabled=true;
  shareButton.style.display="none";
  pdfFile=null;
  status.textContent="PDFを作成しています……";

  try{

    const {jsPDF}=window.jspdf;

    const pdf=new jsPDF({
      orientation:"portrait",
      unit:"mm",
      format:"a4",
      compress:true
    });

    const W=1240;
    const H=1754;
    const margin=110;
    const lineHeight=52;
    const maxWidth=W-margin*2;

    const canvas=document.createElement("canvas");
    canvas.width=W;
    canvas.height=H;

    const ctx=canvas.getContext("2d");

    let y=margin;
    let pageCount=0;

    function startPage(){

      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,W,H);

      ctx.fillStyle="#111111";
      ctx.font="30px -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif";
      ctx.textBaseline="top";

      y=margin;
    }

    function finishPage(){

      const image=canvas.toDataURL("image/jpeg",0.94);

      if(pageCount>0){
        pdf.addPage();
      }

      pdf.addImage(
        image,
        "JPEG",
        0,
        0,
        210,
        297,
        undefined,
        "FAST"
      );

      pageCount++;
    }

    function addLine(line){

      if(y+lineHeight>H-margin){
        finishPage();
        startPage();
      }

      if(line!==""){
        ctx.fillText(line,margin,y);
      }

      y+=lineHeight;
    }

    startPage();

    const paragraphs=text
      .replace(/\r\n/g,"\n")
      .replace(/\r/g,"\n")
      .split("\n");

    for(const paragraph of paragraphs){

      if(paragraph===""){
        addLine("");
        continue;
      }

      let line="";

      for(const char of Array.from(paragraph)){

        const test=line+char;

        if(ctx.measureText(test).width>maxWidth && line!==""){
          addLine(line);
          line=char;
        }else{
          line=test;
        }
      }

      if(line!==""){
        addLine(line);
      }
    }

    finishPage();

    const blob=pdf.output("blob");

    pdfFile=new File(
      [blob],
      "document.pdf",
      {type:"application/pdf"}
    );

    shareButton.style.display="block";

    status.textContent=
      "PDFが完成しました。全"+pageCount+"ページです。";

  }catch(error){

    console.error(error);

    status.textContent=
      "PDFを作成できませんでした。もう一度お試しください。";

  }finally{

    button.disabled=false;

  }
}

async function sharePDF(){

  if(!pdfFile){
    alert("先にPDFを作成してください。");
    return;
  }

  try{

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[pdfFile]})
    ){

      await navigator.share({
        files:[pdfFile],
        title:"PDF"
      });

    }else{

      const url=URL.createObjectURL(pdfFile);
      const a=document.createElement("a");

      a.href=url;
      a.download="document.pdf";

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },60000);

      document.getElementById("status").textContent=
        "PDFを保存しました。ファイルアプリから共有してください。";
    }

  }catch(error){

    if(error.name!=="AbortError"){

      document.getElementById("status").textContent=
        "共有できませんでした。もう一度お試しください。";

    }
  }
}
</script>

</body>
</html>
