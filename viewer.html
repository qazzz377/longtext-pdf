<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>pdf</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:30px 20px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:#222;
  background:#fff;
  text-align:center;
}
p{line-height:1.8}
a{
  display:block;
  margin-top:20px;
  color:#06c;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<p id="message">PDFを開いています…</p>
<a id="link" hidden>PDFを開く</a>

<script>
(function(){
  const message=document.getElementById("message");
  const link=document.getElementById("link");

  const params=new URLSearchParams(location.search);
  const address=params.get("url");

  if(!address){
    message.textContent="PDFのURLが見つかりません。";
    return;
  }

  let pdf;

  try{
    pdf=new URL(address);
  }catch(e){
    message.textContent="PDFのURLが正しくありません。";
    return;
  }

  if(pdf.protocol!=="https:"){
    message.textContent="安全でないURLのため開けません。";
    return;
  }

  link.href=pdf.href;
  link.textContent="PDFを開く";
  link.hidden=false;

  location.replace(pdf.href);
})();
</script>

</body>
</html>
