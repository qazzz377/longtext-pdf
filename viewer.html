<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eee}
iframe{width:100%;height:100%;border:0}
#status{padding:20px;font-family:sans-serif}
</style>
</head>
<body>
<div id="status">PDFを読み込んでいます。</div>
<script>
const url=new URLSearchParams(location.search).get("url");
if(url && url.startsWith("https://aisenseapi.com/services/v1/storage/")){
 const frame=document.createElement("iframe");
 frame.src="https://docs.google.com/gview?embedded=1&url="+encodeURIComponent(url);
 frame.onload=()=>document.getElementById("status").remove();
 document.body.appendChild(frame);
}else{
 document.getElementById("status").textContent="PDFのURLが見つかりません。";
}
</script>
</body>
</html>
