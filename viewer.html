<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eee}
iframe{width:100%;height:100%;border:0}
p{padding:20px;font-family:sans-serif}
</style>
</head>
<body>
<iframe id="pdf"></iframe>
<script>
const url=new URLSearchParams(location.search).get("url");
if(url && url.startsWith("https://aisenseapi.com/services/v1/storage/")){
 document.getElementById("pdf").src=url;
}else{
 document.body.innerHTML="<p>PDFのURLが見つかりません。</p>";
}
</script>
</body>
</html>
