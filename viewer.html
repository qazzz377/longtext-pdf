<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>pdf</title>
<style>
html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#eee;
 font-family:-apple-system,sans-serif;
}
#status{
 padding:20px;
 font-size:15px;
}
#pdf{
 display:none;
 width:100%;
 height:100%;
 border:0;
}
#download{
 display:none;
 margin:20px;
 padding:15px;
 background:#111;
 color:white;
 text-align:center;
 text-decoration:none;
 border-radius:8px;
}
</style>
</head>
<body>

<div id="status">PDFを読み込んでいます…</div>
<iframe id="pdf"></iframe>
<a id="download">PDFをダウンロード</a>

<script>
(async()=>{
 const status=document.getElementById("status");
 const frame=document.getElementById("pdf");
 const download=document.getElementById("download");

 const url=new URLSearchParams(location.search).get("url");

 if(!url){
  status.textContent="PDFのURLがありません。";
  return;
 }

 try{
  const target=new URL(url);

  if(target.protocol!=="https:"){
   throw new Error("安全でないURLです");
  }

  const response=await fetch(target.href);

  if(!response.ok){
   throw new Error("PDFを取得できませんでした");
  }

  const blob=await response.blob();

  if(blob.size===0){
   throw new Error("PDFデータが空です");
  }

  const localURL=URL.createObjectURL(
   new Blob([blob],{type:"application/pdf"})
  );

  frame.src=localURL;
  frame.style.display="block";
  status.style.display="none";

  download.href=localURL;
  download.download="document.pdf";
  download.style.display="block";

 }catch(error){
  status.textContent=
   "ブラウザ内で表示できませんでした。\n"+
   "PDFを直接ダウンロードして開いてください。";

  download.href=url;
  download.style.display="block";
 }
})();
</script>

</body>
</html>
