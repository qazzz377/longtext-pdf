<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PDF閲覧</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eee}
iframe{width:100%;height:100%;border:0}
#message{padding:24px;font-family:sans-serif}
</style>
</head>
<body>
<div id="message">PDFを読み込んでいます……</div>
<script>
const url=new URLSearchParams(location.search).get("url");

if(url && /^https:\/\/aisenseapi\.com\/services\/v1\/storage\/[a-f0-9-]+$/i.test(url)){
  const frame=document.createElement("iframe");
  frame.src=url;
  frame.title="PDF";
  document.body.appendChild(frame);
  document.getElementById("message").remove();
}else{
  document.getElementById("message").textContent="PDFのURLが正しくありません。";
}
</script>
</body>
</html>
